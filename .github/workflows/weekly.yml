name: 每周周报

# 无论是否漂移，每周汇总一次推微信，让人知道"它还在盯着、现在什么情况"。
#   UTC 01:07 周日 = 北京时间 周日 09:07
# 为什么用 :07：避开整点，减少 GitHub 定时任务被延迟/丢弃的概率。
# 为什么也 commit 回仓库：周报前会先跑一次 monitor.py 做补跑兜底，
#   产生的净值缓存同样要落库，否则下次又得重拉。
on:
  schedule:
    - cron: '7 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund-monitor
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 1/3 先刷新数据（周末补跑兜底）
        run: |
          set +e
          python3 monitor.py
          rc=$?
          set -e
          echo "monitor 退出码 = $rc"
          # 周报不因巡检触发预警而失败，只有执行失败(≥2)才中断
          if [ "$rc" -ge 2 ]; then
            echo "::error::巡检执行失败"
            exit 1
          fi

      - name: 2/3 推送周报 notify.py weekly
        if: always()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 notify.py weekly

      - name: 3/3 刷新看板
        if: always()
        run: python3 "生成看板.py"

      - name: 数据提交回仓库
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 数据 index.html
          if git diff --cached --quiet; then
            echo "本次无数据变化，跳过提交"
          else
            git commit -m "chore(data): 周报数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
            echo "✅ 数据已提交回仓库"
          fi
